<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d">
<title id="t">Choosing a Node.js LLM library</title>
<desc id="d">Start from what you are building. A chat UI in the browser points to the Vercel AI SDK. Complex stateful workflows point to LangGraph.js or Mastra. One backend API across cloud and local models points to IntelliNode.</desc>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9CC7"/>
  </marker>
  <marker id="head-start" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9CC7"/>
  </marker>
</defs>
<rect width="720" height="380" fill="#FFFFFF"/>
<rect x="30.0" y="148.0" width="220" height="84" rx="16" fill="#8B6FE0" fill-opacity="0.09" stroke="#8B6FE0" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="140" y="184" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">What are you</text>
<text x="140" y="210" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">building?</text>
<rect x="420" y="42" width="280" height="76" rx="38" fill="#2F80ED" fill-opacity="0.09" stroke="#2F80ED" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="560" y="76" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2540" text-anchor="middle">Vercel AI SDK</text>
<text x="560" y="100" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">a chat UI in the browser</text>
<path d="M 252 151.5 L 416 80" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="420" y="152" width="280" height="76" rx="38" fill="#C45AD1" fill-opacity="0.09" stroke="#C45AD1" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="560" y="186" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2540" text-anchor="middle">LangGraph.js or Mastra</text>
<text x="560" y="210" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">complex, stateful workflows</text>
<path d="M 252 190.0 L 416 190" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="420" y="262" width="280" height="76" rx="38" fill="#119C88" fill-opacity="0.09" stroke="#119C88" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="560" y="296" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2540" text-anchor="middle">IntelliNode</text>
<text x="560" y="320" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">one API for cloud and local models</text>
<path d="M 252 228.5 L 416 300" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
</svg>
