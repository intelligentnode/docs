<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-labelledby="t d">
<title id="t">Self-healing CI with a person in charge</title>
<desc id="d">A red build starts the guarded coding agent. Its diff goes to a reviewer on another model family, and the review report goes to a person who decides whether to merge the pull request.</desc>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9CC7"/>
  </marker>
  <marker id="head-start" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9CC7"/>
  </marker>
</defs>
<rect width="720" height="240" fill="#FFFFFF"/>
<rect x="10.0" y="88.0" width="140" height="64" rx="32.0" fill="#C45AD1" fill-opacity="0.09" stroke="#C45AD1" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="80" y="117" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Red build</text>
<text x="80" y="140" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">CI fails</text>
<rect x="200.0" y="88.0" width="150" height="64" rx="16" fill="#2F80ED" fill-opacity="0.09" stroke="#2F80ED" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="275" y="117" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Coding agent</text>
<text x="275" y="140" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">guarded</text>
<rect x="400.0" y="88.0" width="150" height="64" rx="16" fill="#8B6FE0" fill-opacity="0.09" stroke="#8B6FE0" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="475" y="117" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Reviewer</text>
<text x="475" y="140" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">another model</text>
<rect x="600.0" y="88.0" width="110" height="64" rx="32.0" fill="#119C88" fill-opacity="0.09" stroke="#119C88" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="655" y="117" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Human</text>
<text x="655" y="140" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">merges PR</text>
<path d="M 152 120 L 198 120" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M 352 120 L 398 120" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<text x="375" y="108" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6680" text-anchor="middle">diff</text>
<path d="M 552 120 L 598 120" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<text x="575" y="108" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6680" text-anchor="middle">report</text>
</svg>
