<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" width="720" height="690" role="img" aria-labelledby="t d">
<title id="t">The AI agent loop in Python</title>
<desc id="d">A customer question goes to the model through the Intelli Chatbot. If the model asks for a tool, your Python function runs, the result is added to the conversation and the model is called again. When the model answers in plain text, the answer goes to the customer. A max_steps cap stops the loop.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#091434"/><stop offset="1" stop-color="#1E164E"/>
  </linearGradient>
  <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9DB8FF"/>
  </marker>
  <marker id="head-start" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9DB8FF"/>
  </marker>
</defs>
<rect width="720" height="690" rx="18" fill="url(#bg)"/>
<rect x="90" y="36" width="260" height="52" rx="26.0" fill="#B8A0F5" fill-opacity="0.22" stroke="#B8A0F5" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="220" y="69" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F3F6FF" text-anchor="middle">Customer question</text>
<path d="M 220 88 L 220 128" fill="none" stroke="#9DB8FF" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="60" y="130" width="320" height="96" rx="14" fill="#2992FE" fill-opacity="0.14" stroke="#2992FE" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="220" y="168" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F3F6FF" text-anchor="middle">The model</text>
<text x="220" y="197.7" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B9C6EE" text-anchor="middle">Intelli Chatbot: OpenAI, Claude or Ollama</text>
<path d="M 220 226 L 220 290" fill="none" stroke="#9DB8FF" stroke-width="1.8" marker-end="url(#head)"/>
<polygon points="220,292 328,350 220,408 112,350" fill="#B8A0F5" fill-opacity="0.14" stroke="#B8A0F5" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="220" y="357" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#F3F6FF" text-anchor="middle">Tool call?</text>
<path d="M 220 408 L 220 468" fill="none" stroke="#9DB8FF" stroke-width="1.8" marker-end="url(#head)"/>
<text x="232" y="445" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#B9C6EE" text-anchor="start">no, plain text</text>
<rect x="90" y="470" width="260" height="52" rx="26.0" fill="#2DD4BF" fill-opacity="0.22" stroke="#2DD4BF" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="220" y="503" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F3F6FF" text-anchor="middle">Answer the customer</text>
<path d="M 328 350 L 468 350" fill="none" stroke="#9DB8FF" stroke-width="1.8" marker-end="url(#head)"/>
<text x="398" y="338" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#B9C6EE" text-anchor="middle">yes</text>
<rect x="470" y="300" width="220" height="100" rx="14" fill="#2DD4BF" fill-opacity="0.14" stroke="#2DD4BF" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="580" y="336" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F3F6FF" text-anchor="middle">Run the tool</text>
<text x="580" y="363.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B9C6EE" text-anchor="middle">your Python function</text>
<text x="580" y="382.575" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="500" fill="#2DD4BF" text-anchor="middle">get_order_status()</text>
<path d="M 580 300 L 580 228" fill="none" stroke="#9DB8FF" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="470" y="150" width="220" height="76" rx="14" fill="#2992FE" fill-opacity="0.14" stroke="#2992FE" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="580" y="182" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F3F6FF" text-anchor="middle">Add the results</text>
<text x="580" y="204.95" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F3F6FF" text-anchor="middle">to the conversation</text>
<path d="M 470 188 L 382 188" fill="none" stroke="#9DB8FF" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#head)"/>
<text x="425" y="176" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#B9C6EE" text-anchor="middle">next step</text>
<rect x="60" y="570" width="630" height="84" rx="14" fill="#B8A0F5" fill-opacity="0.08" stroke="#B8A0F5" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="375" y="604" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F3F6FF" text-anchor="middle">Stop rule: at most max_steps model calls</text>
<text x="375" y="626.95" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B9C6EE" text-anchor="middle">On the last step the tools are removed, so the model has to answer in text.</text>
</svg>
