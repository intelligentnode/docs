<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" width="760" height="225" role="img" aria-labelledby="t d">
<title id="t">One turn of the voice receptionist</title>
<desc id="d">The caller speaks. The agent turns the speech into text, answers from the clinic documents and booking tools, and speaks the answer back to the caller.</desc>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9CC7"/>
  </marker>
</defs>
<rect width="760" height="225" fill="#FFFFFF"/>
<rect x="20" y="70" width="130" height="64" rx="32" fill="#8B6FE0" fill-opacity="0.09" stroke="#8B6FE0" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="85" y="98" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Caller</text>
<text x="85" y="120" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6680" text-anchor="middle">on the phone</text>
<rect x="210" y="70" width="140" height="64" rx="16" fill="#2F80ED" fill-opacity="0.09" stroke="#2F80ED" stroke-opacity="0.9" stroke-width="1.5"/>
<text x="280" y="98" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Hear</text>
<text x="280" y="120" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6680" text-anchor="middle">speech to text</text>
<circle cx="480" cy="102" r="72" fill="#119C88" fill-opacity="0.09" stroke="#119C88" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="480" y="94" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Think</text>
<text x="480" y="116" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6680" text-anchor="middle">clinic documents</text>
<text x="480" y="134" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6680" text-anchor="middle">and booking tools</text>
<rect x="610" y="70" width="130" height="64" rx="16" fill="#2F80ED" fill-opacity="0.09" stroke="#2F80ED" stroke-opacity="0.9" stroke-width="1.5"/>
<text x="675" y="98" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Speak</text>
<text x="675" y="120" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6680" text-anchor="middle">text to speech</text>
<path d="M 152 102 L 206 102" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M 352 102 L 404 102" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M 554 102 L 606 102" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M 675 136 C 675 215, 85 215, 85 138" fill="none" stroke="#8A9CC7" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#head)"/>
</svg>
