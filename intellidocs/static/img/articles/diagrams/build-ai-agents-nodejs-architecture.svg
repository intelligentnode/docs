<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d">
<title id="t">The support agent</title>
<desc id="d">The customer talks to the agent. The agent uses tools to look up orders. Refunds go to a person, who approves them before anything is paid.</desc>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9CC7"/>
  </marker>
  <marker id="head-start" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9CC7"/>
  </marker>
</defs>
<rect width="720" height="380" fill="#FFFFFF"/>
<rect x="25.0" y="122.0" width="160" height="56" rx="28.0" fill="#8B6FE0" fill-opacity="0.09" stroke="#8B6FE0" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="105" y="157" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Customer</text>
<circle cx="360" cy="150" r="70" fill="#2F80ED" fill-opacity="0.09" stroke="#2F80ED" stroke-opacity="0.9" stroke-width="1.5"/>
<text x="360" y="148" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2540" text-anchor="middle">Agent</text>
<text x="360" y="172" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">model and loop</text>
<rect x="530.0" y="118.0" width="170" height="64" rx="16" fill="#119C88" fill-opacity="0.09" stroke="#119C88" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="615" y="147" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Tools</text>
<text x="615" y="170" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">order lookups</text>
<rect x="260.0" y="280.0" width="200" height="60" rx="30.0" fill="#C45AD1" fill-opacity="0.09" stroke="#C45AD1" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="360" y="307" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">A person</text>
<text x="360" y="330" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">approves refunds</text>
<path d="M 187 150 L 287 150" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)" marker-start="url(#head-start)"/>
<path d="M 432 150 L 528 150" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)" marker-start="url(#head-start)"/>
<path d="M 360 222 L 360 278" fill="none" stroke="#8A9CC7" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#head)"/>
<text x="372" y="256" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6680" text-anchor="start">refunds</text>
</svg>
