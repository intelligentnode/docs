<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t d">
<title id="t">One flow, two models</title>
<desc id="d">Tickets go into a flow. The flow sends sorting and labeling to a local model that is private and free, and sends the replies customers read to a cloud model.</desc>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9CC7"/>
  </marker>
  <marker id="head-start" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9CC7"/>
  </marker>
</defs>
<rect width="720" height="320" fill="#FFFFFF"/>
<rect x="20.0" y="128.0" width="150" height="64" rx="32.0" fill="#8B6FE0" fill-opacity="0.09" stroke="#8B6FE0" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="95" y="157" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Tickets</text>
<text x="95" y="180" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">your data</text>
<circle cx="320" cy="160" r="66" fill="#2F80ED" fill-opacity="0.09" stroke="#2F80ED" stroke-opacity="0.9" stroke-width="1.5"/>
<text x="320" y="158" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2540" text-anchor="middle">Flow</text>
<text x="320" y="182" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">steps in a graph</text>
<rect x="500.0" y="58.0" width="190" height="64" rx="16" fill="#119C88" fill-opacity="0.09" stroke="#119C88" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="595" y="87" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Local model</text>
<text x="595" y="110" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">private and free</text>
<rect x="500.0" y="198.0" width="190" height="64" rx="16" fill="#C45AD1" fill-opacity="0.09" stroke="#C45AD1" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="595" y="227" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Cloud model</text>
<text x="595" y="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">replies customers read</text>
<path d="M 172 160 L 251 160" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M 381 135 L 497 97" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<text x="432" y="100" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6680" text-anchor="middle">sort and label</text>
<path d="M 381 185 L 497 223" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<text x="432" y="228" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6680" text-anchor="middle">write replies</text>
</svg>
