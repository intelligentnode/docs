<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" width="720" height="880" role="img" aria-labelledby="t d">
<title id="t">Six agentic workflow patterns in Python</title>
<desc id="d">Six small graphs: a sequential chain, a parallel fan-out that merges, a classifier that routes to one branch, a draft and review loop, a model routing tool calls to an MCP server, and a step that runs your own code before a person approves.</desc>
