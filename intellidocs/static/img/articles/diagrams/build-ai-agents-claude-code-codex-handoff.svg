<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t d">
<title id="t">Handing Intelli to a coding agent</title>
<desc id="d">AGENTS.md holds the short rules and is loaded with every session. llms.txt is the docs index the agent reads when it needs more. With both, Claude Code or Codex writes a working Intelli app, a Flow or a Vibe Agent.</desc>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9CC7"/>
  </marker>
  <marker id="head-start" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9CC7"/>
  </marker>
</defs>
<rect width="720" height="320" fill="#FFFFFF"/>
<rect x="20.0" y="63.0" width="170" height="64" rx="16" fill="#8B6FE0" fill-opacity="0.09" stroke="#8B6FE0" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="105" y="92" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">AGENTS.md</text>
<text x="105" y="115" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">rules in your repo</text>
<rect x="20.0" y="193.0" width="170" height="64" rx="16" fill="#C45AD1" fill-opacity="0.09" stroke="#C45AD1" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="105" y="222" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">llms.txt</text>
<text x="105" y="245" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">docs index</text>
<rect x="285.0" y="124.0" width="170" height="72" rx="16" fill="#2F80ED" fill-opacity="0.09" stroke="#2F80ED" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="370" y="157" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Coding agent</text>
