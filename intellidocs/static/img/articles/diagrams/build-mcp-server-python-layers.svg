<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="t d">
<title id="t">Where the MCP server sits</title>
<desc id="d">An AI app such as Claude, Cursor or an Intelli flow picks a tool on the MCP server. The MCP server calls your existing API with your key. The API does not change.</desc>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9CC7"/>
  </marker>
</defs>
<rect width="720" height="250" fill="#FFFFFF"/>
<rect x="20.0" y="78.0" width="170" height="64" rx="32.0" fill="#8B6FE0" fill-opacity="0.09" stroke="#8B6FE0" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="105" y="106" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">AI app</text>
<text x="105" y="128" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">Claude, Cursor, a flow</text>
<circle cx="360" cy="110" r="74" fill="#2F80ED" fill-opacity="0.09" stroke="#2F80ED" stroke-opacity="0.9" stroke-width="1.5"/>
<text x="360" y="106" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2540" text-anchor="middle">MCP server</text>
<text x="360" y="130" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">your tools, in Python</text>
<rect x="540.0" y="78.0" width="160" height="64" rx="16" fill="#119C88" fill-opacity="0.09" stroke="#119C88" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="620" y="106" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2540" text-anchor="middle">Your API</text>
<text x="620" y="128" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">unchanged</text>
<path d="M 192 110 L 283 110" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M 437 110 L 538 110" fill="none" stroke="#8A9CC7" stroke-width="1.8" marker-end="url(#head)"/>
<text x="237" y="96" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6680" text-anchor="middle">picks a tool</text>
<text x="487" y="96" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5B6680" text-anchor="middle">uses your key</text>
<text x="360" y="216" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6680" text-anchor="middle">The key stays on the server and never enters the chat.</text>
</svg>
